<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;font-family:'Noto Sans',system-ui,sans-serif;background:#0a1c4a;color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bg{position:fixed;inset:0;background:#0a1c4a;background-image:radial-gradient(rgba(255,255,255,.07) 1.1px,transparent 1.1px);background-size:17px 17px;pointer-events:none;z-index:0}

.m-head{padding:20px 20px 12px;display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.m-photo{width:56px;height:56px;border-radius:8px;object-fit:cover;border:none;background:#132a4a;flex-shrink:0}
.m-name{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:.2px}

.m-tabs{display:flex;gap:8px;padding:0 16px 16px;position:relative;z-index:2}
.m-tab{flex:1;padding:11px 8px;border-radius:11px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer;text-align:center}
.m-tab.on{background:#1a9fff}

.m-list{padding:0 8px;position:relative;z-index:2}
.m-item{padding:15px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:15px;font-weight:400}
.m-item svg{opacity:.45;width:16px;height:16px;flex-shrink:0}
.m-item .ext{opacity:.45;width:16px;height:16px}

.m-acts{padding:18px 16px 30px;position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.m-act{
  width:100%;padding:13px 16px;border-radius:12px;
  border:1.5px solid rgba(255,255,255,.28);background:transparent;
  color:#fff;font-size:15px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:12px;
}
.m-act svg{width:22px;height:22px;flex-shrink:0;opacity:.95}
.m-act.red{
  background:#c0392b;border:none;justify-content:flex-start;
  margin-top:4px;
}
.m-act.red svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="bg"></div>

<div class="m-head">
  <img class="m-photo" id="m-photo" src="" alt="">
  <div class="m-name" id="m-name"></div>
</div>

<div class="m-tabs">
  <button class="m-tab on" onclick="parent.postMessage({nav:'detail'},'*')">Η θυρίδα μου</button>
  <button class="m-tab">Το προφίλ μου</button>
</div>

<div class="m-list">
  <div class="m-item" onclick="parent.postMessage({nav:'detail'},'*')">
    Αρχική
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>
  <div class="m-item">
    Όλες οι υπηρεσίες
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>
  <div class="m-item">
    Συχνές ερωτήσεις
    <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
  </div>
  <div class="m-item">
    Επικοινωνία
    <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
  </div>
  <div class="m-item">
    Επικοινωνία για τα εισιτήρια
    <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
  </div>
</div>

<div class="m-acts">
  <button class="m-act">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 6v12M18 6v12"/></svg>
    Εισιτήρια
  </button>
  <button class="m-act">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Έλεγχος Εγγράφου
  </button>
  <button class="m-act">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" fill="#fff" stroke="none" font-weight="700">18+</text></svg>
    Επαλήθευση Ηλικίας
  </button>
  <button class="m-act red">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
    Μήνυμα 112
  </button>
</div>

<script>
/* ===== BLANK SLATE – edit these values ===== */
const DATA = {
  photo: "",          // put image URL or leave blank
  nameEl: "",         // first name
  surnameEl: ""       // last name
};
/* ========================================== */

const photoEl = document.getElementById("m-photo");
const nameEl  = document.getElementById("m-name");

if (DATA.photo) {
  photoEl.src = DATA.photo;
} else {
  photoEl.style.background = "#1a2f55";
  photoEl.removeAttribute("src");
}

nameEl.innerHTML = (DATA.nameEl || "") + (DATA.surnameEl ? "<br>" + DATA.surnameEl : "");
</script>
</body>
</html>
